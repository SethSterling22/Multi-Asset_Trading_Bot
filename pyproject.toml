[project]
name = "multi-asset-trading-bot"
version = "0.1.0"
description = "Plataforma de trading multi-activo y multi-estrategia (ver docs/INFORME_TALOS.md)."
readme = "README.md"
license = { file = "LICENSE" }
# Lumibot solo está clasificado hasta 3.12 (CLAUDE.md §2).
requires-python = ">=3.12,<3.13"
# Lo que importa core/ (config, ledger, logging): lo necesitan todos los servicios y CI.
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
]

# Un grupo por servicio. Cada contenedor instala solo el suyo
# (`uv sync --no-default-groups --group <servicio>`); en desarrollo se instalan todos.
[dependency-groups]
engine = [
    "lumibot>=3.8",
    "alpaca-py>=0.30",
    "coinbase-advanced-py>=1.7",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "redis>=5.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "asyncpg>=0.29",
    "jinja2>=3.1",
    "redis>=5.0",          # el dashboard lee el estado del kill switch
    "httpx>=0.27",         # TestClient de FastAPI
]
# Sin claves de exchange: el llm-analyst no las necesita ni las recibe (CLAUDE.md §2).
llm = [
    "anthropic>=0.40",
    "httpx>=0.27",
]
# Solo mientras viva app_dashboard.py; se elimina al jubilar Streamlit (sesión 7).
legacy-dashboard = [
    "streamlit>=1.38",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.uv]
default-groups = ["engine", "api", "llm", "legacy-dashboard", "dev"]

# --------------------------------------------------------------------------- #
# ruff                                                                         #
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    # Material de referencia del informe: se conserva literal, no se lintea.
    "docs",
    # Código heredado pendiente de jubilar (sesión 7). No se toca todavía.
    "app_dashboard.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    # Comentarios y docstrings en español: tildes, rayas y signos menos son intencionados.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
# Generadores de datos sintéticos: aleatoriedad reproducible, no criptográfica.
"scripts/**" = ["S311"]
# DDL estático compuesto con constantes del propio fichero, sin input externo.
"migrations/versions/**" = ["S608"]

# --------------------------------------------------------------------------- #
# mypy — strict en core/ y risk/                                               #
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
files = ["core", "risk", "brokers", "execution", "strategies/base.py", "strategies/runtime.py",
         "strategies/wheel/logic.py", "strategies/wheel/accounting.py",
         "strategies/crypto_rebalance/live.py"]
strict = true
warn_unreachable = true

# --------------------------------------------------------------------------- #
# pytest                                                                       #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "guards: tests de guards que no pueden fallar nunca (CLAUDE.md §1.8)",
    "stats: tests de propiedad de core/stats",
    "integration: tests contra sandbox/testnet; requieren red y credenciales de prueba",
    "db: tests contra Postgres + TimescaleDB; requieren TEST_DATABASE_URL",
]
