# Ejecución del proyecto en Sadida, en contenedores sobre el Docker del host de
# Proxmox (DECISIONS.md D-012). Interino hasta el compose completo de la Fase 1.
#
#   sudo docker compose -f docker/compose.runtime.yml --env-file /etc/trading/compose.env up -d --build
#
# Secretos (interino hasta SOPS + age, Fase 1.2), fuera del repo y de la imagen:
#   /etc/trading/              el directorio                           (root, 0700)
#   /etc/trading/pg_password   contraseña de Postgres                  (root, 0444)
#   /etc/trading/env           claves de PAPER de Alpaca y Coinalyze   (root, 0600)
#   /etc/trading/compose.env   TRADING_DATA_DIR=/mnt/data/trading
#
# pg_password tiene que ser legible: fuera de Swarm, un secreto de compose es un
# montaje del fichero del host con SUS permisos, y Postgres (uid 1000) y la app (uid
# 10001) no son root. Lo protege el directorio en 0700: en el host nadie salvo root
# llega a él. `env` sí se queda en 0600: lo lee compose en el host, como root.
#
# Kill switch: /run/trading del host está montado en el Wheel y en `crypto` (solo lectura).
#   sudo mkdir -p /run/trading && sudo touch /run/trading/HALT     # para todo
name: trading

# Lo común a los procesos de la app: acceso a Postgres y Redis por la red interna.
x-app-db: &app-db
  environment:
    # La contraseña se lee del secreto al arrancar; nunca va en un env_file.
    PG_PASSWORD_FILE: /run/secrets/pg_password
  secrets: [pg_password]
  networks: [data]
  # Construye DATABASE_URL con la contraseña del secreto y ejecuta el comando.
  entrypoint:
    - sh
    - -c
    - >
      export DATABASE_URL="postgresql+psycopg://trading:$$(cat $$PG_PASSWORD_FILE)@postgres:5432/trading"
      REDIS_URL="redis://redis:6379/0"; exec "$$@"
    - app

# El motor: además, las claves de los brokers y de Coinalyze.
x-engine: &engine
  <<: *app-db
  build:
    context: ..
    dockerfile: docker/Dockerfile.engine
  image: trading-engine:local
  env_file: /etc/trading/env

services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_DB: trading
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets: [pg_password]
    networks: [data]
    # Solo para administrar desde el propio host (psql); nada escucha hacia la red.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${TRADING_DATA_DIR:?define TRADING_DATA_DIR}/postgres:/home/postgres/pgdata
    shm_size: 1gb
    stop_grace_period: 120s        # checkpoint limpio al apagar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    networks: [data]
    volumes:
      - ${TRADING_DATA_DIR:?define TRADING_DATA_DIR}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Migraciones: una vez, antes de cualquier otro proceso de la app.
  migrate:
    <<: *engine
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # Archivador de Coinalyze cada 6 h. Ejecuta nada más arrancar: tras un corte de luz
  # o un reinicio se pone al día enseguida (Coinalyze conserva ~25 h a 1 minuto).
  archiver:
    <<: *engine
    command: ["python", "-m", "data.ingest.coinalyze", "run", "--every-hours", "6"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }

  # El Wheel en PAPER (live_trading_mode=false en config.json).
  wheel:
    <<: *engine
    command: ["python", "-m", "strategies.wheel"]
    # Un bucle de caídas no es "reintentar": tras 5 fallos se queda parado.
    restart: on-failure:5
    stop_signal: SIGTERM           # parada ordenada (strategies/runtime.py), forzada a 30 s
    stop_grace_period: 45s
    volumes:
      - /run/trading:/run/trading:ro    # fuente "fichero" del kill switch
      # config.json del host: editarlo en Sadida surte efecto sin reconstruir la imagen
      # (el Wheel lo recarga por mtime).
      - ../config.json:/app/config.json:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Rebalanceador cripto contra Alpaca PAPER (D-014). Perfil `crypto`: no arranca con un
  # `up -d` normal, hay que pedirlo con `--profile crypto`. Y aun así va en dry-run hasta
  # que /etc/trading/env diga CRYPTO_DRY_RUN=false.
  crypto:
    <<: *engine
    command: ["python", "-m", "strategies.crypto_rebalance.live"]
    profiles: [crypto]
    restart: on-failure:5
    stop_signal: SIGTERM
    stop_grace_period: 45s
    volumes:
      - /run/trading:/run/trading:ro
      - ../config.json:/app/config.json:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Dashboard de solo lectura (D-013). SIN las claves de brokers ni de Coinalyze: solo
  # necesita leer la base, y la conexión es read-only impuesta por el servidor.
  dashboard:
    <<: *app-db
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: trading-dashboard:local
    command: ["python", "-m", "api"]
    restart: unless-stopped
    ports:
      # 127.0.0.1 + `tailscale serve`, o la IP de Tailscale del host (compose.env).
      - "${DASHBOARD_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - /run/trading:/run/trading:ro
      - ../config.json:/app/config.json:ro
    depends_on:
      migrate: { condition: service_completed_successfully }

networks:
  data:

secrets:
  pg_password:
    file: /etc/trading/pg_password
